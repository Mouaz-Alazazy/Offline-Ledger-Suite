[package]
name = "hisab-accounting"
version = "1.0.0"
description = "منظومة حساب محلية تعمل دون اتصال"
authors = ["منظومة حساب"]
edition = "2021"

[lib]
name = "hisab_accounting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
